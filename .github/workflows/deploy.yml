name: Deploy

on:
  push:
    branches: [main]
  # Relanzar el deploy a mano, sin tener que inventar un commit vacío. Sirve cuando el deploy
  # falló por algo ajeno al código (red, servidor caído) o para redeployar el mismo commit.
  # `verify` corre igual: un dispatch no saltea las pruebas.
  workflow_dispatch:

concurrency:
  group: deploy-solmios
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Backend typecheck + analyze + test
        working-directory: backend
        run: |
          bun install
          bun run typecheck
          bun run analyze
          bun test --env-file .env.test

      - name: Frontend typecheck + tests
        working-directory: frontend
        run: |
          bun install
          bun run typecheck
          bun run test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy (comando real forzado del lado del servidor)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "echo deploy-trigger"
