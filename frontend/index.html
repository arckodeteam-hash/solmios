    <title>SolmiOS — Hospitality OS</title>
    <!-- HMR crash recovery: /__alive solo existe en dev (Vite). En prod no pollear. -->
    <script>
      var DEV_PORT = '5173' // Vite dev server (vite.config: server.port)
      if (location.port === DEV_PORT || location.hostname === 'localhost') {
        (function() {
          var POLL_INTERVAL_MS = 2000;
          var wasDown = false;
          setInterval(function() {
            fetch('/__alive', { method: 'HEAD', cache: 'no-store' })
              .then(function(res) {
                if (wasDown && res.ok) {
                  wasDown = false;
                  location.reload();
                }
              })
              .catch(function() {
                wasDown = true;
              });
          }, POLL_INTERVAL_MS);
        })();
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
